apiVersion: core.gardener.cloud/v1beta1
kind: Shoot
metadata:
  name: local
  namespace: garden-local
  annotations:
    shoot.gardener.cloud/cloud-config-execution-max-delay-seconds: "0"
    authentication.gardener.cloud/issuer: "managed"
spec:
  # Purpose must be "evaluation" to enable the Envoy Gateway extension.
  # This is enforced by the admission webhook during the GEP-68 incubation phase.
  purpose: evaluation
  extensions:
    # The envoy-gateway extension deploys the Envoy Gateway control plane
    # and the Gateway API standard-channel CRDs into the shoot cluster, and
    # registers a GatewayClass named "gardener-envoy-gateway".
    - type: envoy-gateway
      providerConfig:
        apiVersion: envoy-gateway.extensions.gardener.cloud/v1alpha1
        kind: EnvoyGatewayConfig
        # Envoy Gateway control-plane settings.
        controlPlane:
          # Optional: number of control-plane replicas. Default: 2.
          # replicas: 2
          # Optional: control-plane log level. debug|info|warn|error. Default: info.
          # logLevel: info
        # Envoy data-plane (proxy) settings, applied per Gateway.
        dataPlane:
          # Optional: number of proxy replicas per Gateway. Default: 2.
          # replicas: 2
          # Optional: data-plane log level. debug|info|warn|error. Default: info.
          # logLevel: info
        # Optional: Gateway API channel to install. standard|experimental.
        # Selecting "experimental" additionally installs the experimental-channel
        # CRDs (TCPRoute, TLSRoute, UDPRoute, BackendTLSPolicy). Default: standard.
        # channel: standard
        # Optional: manage (install and update) the Gateway API CRDs. Set to
        # false if the CRDs are owned externally. Default: true.
        # manageCRDs: true
        # Optional: opinionated defaults applied to every Gateway via an
        # EnvoyProxy template reference.
        # envoyProxyDefaults:
        #   accessLogging: true
        #   resources:
        #     requests:
        #       cpu: 100m
        #       memory: 256Mi
  cloudProfile:
    name: local
    kind: CloudProfile
  credentialsBindingName: local # dummy, doesn't contain any credentials
  region: local
  networking:
    type: calico
    nodes: 10.0.0.0/16
  provider:
    type: local
    workers:
      - name: local
        machine:
          type: local
        cri:
          name: containerd
        minimum: 1
        maximum: 2
        maxSurge: 1
        maxUnavailable: 0
  kubernetes:
    kubelet:
      seccompDefault: true
      serializeImagePulls: false
      registryPullQPS: 10
      registryBurst: 20
      protectKernelDefaults: true
      streamingConnectionIdleTimeout: 5m
